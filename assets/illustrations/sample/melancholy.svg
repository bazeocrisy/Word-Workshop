<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">A sad child sitting alone by a window, looking down while grey rain clouds pour outside</title>
  <rect x="8" y="8" width="304" height="224" rx="28" fill="#e2e8f0"/>
  <!-- window -->
  <rect x="28" y="28" width="132" height="136" rx="6" fill="#8e9db2" stroke="#ffffff" stroke-width="8"/>
  <g fill="#6e7d93">
    <circle cx="66" cy="66" r="18"/><circle cx="90" cy="56" r="22"/><circle cx="116" cy="66" r="18"/>
    <rect x="48" y="62" width="86" height="22" rx="11"/>
  </g>
  <g stroke="#cfe0f5" stroke-width="3" stroke-linecap="round">
    <path d="M56 96 L50 110 M80 98 L74 112 M104 96 L98 110 M128 98 L122 112 M66 124 L60 138 M92 122 L86 136 M118 124 L112 138 M142 120 L136 134 M44 140 L40 150"/>
  </g>
  <path d="M94 28 V164 M28 96 H160" stroke="#ffffff" stroke-width="6"/>
  <!-- window seat -->
  <rect x="20" y="186" width="280" height="16" rx="8" fill="#8a7a9c"/>
  <rect x="28" y="202" width="264" height="22" rx="6" fill="#a597b5"/>
  <!-- child: legs pulled up -->
  <path d="M190 186 Q176 140 214 138 H236 Q260 140 258 186 Z" fill="#6d7bb0"/>
  <path d="M204 186 Q196 160 224 156 Q248 158 246 186 Z" fill="#59669b"/>
  <ellipse cx="208" cy="184" rx="14" ry="7" fill="#4a3f5c"/>
  <ellipse cx="240" cy="184" rx="14" ry="7" fill="#4a3f5c"/>
  <!-- arms around knees -->
  <path d="M198 150 Q212 168 236 160" stroke="#4f5c92" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="238" cy="160" r="8" fill="#e0a878"/>
  <!-- head tilted down -->
  <circle cx="226" cy="114" r="28" fill="#e0a878"/>
  <path d="M198 112 Q196 82 226 84 Q254 84 254 110 Q246 96 226 96 Q206 98 198 112 Z" fill="#5a3825"/>
  <path d="M212 118 Q216 121 220 118 M232 118 Q236 121 240 118" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M218 132 Q226 126 234 132" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M208 112 L218 107 M244 112 L234 107" stroke="#3a2a20" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M241 124 Q238 130 241 132 Q244 130 241 124 Z" fill="#7fb5e8"/>
  <!-- little grey cloud indoors over the child -->
  <g fill="#9aa5b5">
    <circle cx="214" cy="52" r="12"/><circle cx="230" cy="44" r="15"/><circle cx="246" cy="52" r="12"/>
    <rect x="202" y="50" width="56" height="14" rx="7"/>
  </g>
  <path d="M216 70 L214 76 M232 70 L230 76 M248 70 L246 76" stroke="#7fb5e8" stroke-width="3" stroke-linecap="round"/>
</svg>
