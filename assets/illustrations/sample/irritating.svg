<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">A frustrated child frowning while a buzzing fly circles around their head</title>
  <rect x="8" y="8" width="304" height="224" rx="28" fill="#fff0e6"/>
  <!-- fly path loop -->
  <ellipse cx="160" cy="112" rx="104" ry="70" fill="none" stroke="#b9a69a" stroke-width="3" stroke-dasharray="7 7"/>
  <!-- body -->
  <path d="M104 232 V196 Q104 172 134 170 H186 Q216 172 216 196 V232 Z" fill="#7a5cc4"/>
  <rect x="150" y="154" width="20" height="20" rx="6" fill="#e0a878"/>
  <!-- head -->
  <circle cx="160" cy="120" r="44" fill="#e0a878"/>
  <path d="M116 112 L120 82 L132 92 L140 70 L152 86 L162 66 L172 86 L184 70 L190 92 L202 82 L204 112 Q190 96 160 94 Q130 96 116 112 Z" fill="#1f1a2e"/>
  <circle cx="116" cy="124" r="8" fill="#e0a878"/><circle cx="204" cy="124" r="8" fill="#e0a878"/>
  <!-- cross face -->
  <path d="M128 106 L152 116 M192 106 L168 116" stroke="#1f1a2e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="142" cy="124" r="5" fill="#1f1a2e"/>
  <circle cx="178" cy="124" r="5" fill="#1f1a2e"/>
  <rect x="140" y="140" width="40" height="14" rx="5" fill="#ffffff" stroke="#1f1a2e" stroke-width="3"/>
  <path d="M140 147 H180 M150 140 V154 M160 140 V154 M170 140 V154" stroke="#1f1a2e" stroke-width="2"/>
  <circle cx="128" cy="140" r="6" fill="#e86a5a" opacity="0.6"/><circle cx="192" cy="140" r="6" fill="#e86a5a" opacity="0.6"/>
  <!-- annoyed marks -->
  <g stroke="#e5384b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M86 54 L96 62 L88 68 L100 76"/>
    <path d="M226 50 L216 60 L226 64 L214 74"/>
    <path d="M70 92 L82 94"/>
  </g>
  <!-- fly -->
  <g transform="translate(250 64) rotate(-20)">
    <ellipse cx="-6" cy="-12" rx="12" ry="8" fill="#cfe9ff" stroke="#7aa7cc" stroke-width="2" transform="rotate(-30 -6 -12)"/>
    <ellipse cx="8" cy="-12" rx="12" ry="8" fill="#cfe9ff" stroke="#7aa7cc" stroke-width="2" transform="rotate(30 8 -12)"/>
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#2d2d38"/>
    <circle cx="14" cy="-2" r="8" fill="#2d2d38"/>
    <circle cx="17" cy="-5" r="3.5" fill="#e5384b"/>
  </g>
  <!-- buzz lines -->
  <g stroke="#6b6b7a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M276 40 Q284 46 278 54"/>
    <path d="M286 34 Q298 46 288 60"/>
    <path d="M226 86 Q218 92 222 100"/>
  </g>
</svg>
