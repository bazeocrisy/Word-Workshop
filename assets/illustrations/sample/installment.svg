<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Four calendar months, each adding one more coin, until there is enough to buy a bike</title>
  <rect x="8" y="8" width="304" height="224" rx="28" fill="#eef4ff"/>
  <defs>
    <g id="cal">
      <rect x="0" y="0" width="42" height="46" rx="6" fill="#ffffff" stroke="#5b6b8c" stroke-width="3"/>
      <path d="M1.5 6 Q1.5 1.5 6 1.5 H36 Q40.5 1.5 40.5 6 V14 H1.5 Z" fill="#e5484d"/>
      <rect x="10" y="-5" width="4" height="10" rx="2" fill="#5b6b8c"/>
      <rect x="28" y="-5" width="4" height="10" rx="2" fill="#5b6b8c"/>
      <g fill="#c4cde0">
        <rect x="7" y="20" width="7" height="6" rx="1"/><rect x="18" y="20" width="7" height="6" rx="1"/><rect x="29" y="20" width="7" height="6" rx="1"/>
        <rect x="7" y="31" width="7" height="6" rx="1"/><rect x="18" y="31" width="7" height="6" rx="1"/><rect x="29" y="31" width="7" height="6" rx="1"/>
      </g>
    </g>
    <g id="coin">
      <ellipse cx="0" cy="3" rx="15" ry="5" fill="#c98500"/>
      <ellipse cx="0" cy="0" rx="15" ry="5" fill="#f5b915"/>
      <ellipse cx="0" cy="0" rx="8" ry="2.4" fill="#ffd95a"/>
    </g>
    <path id="down" d="M-5 0 H5 V8 H10 L0 18 L-10 8 H-5 Z" fill="#9aa8c7"/>
  </defs>
  <!-- calendars -->
  <use href="#cal" x="18" y="28"/>
  <use href="#cal" x="66" y="28"/>
  <use href="#cal" x="114" y="28"/>
  <use href="#cal" x="162" y="28"/>
  <!-- arrows -->
  <use href="#down" x="39" y="86"/>
  <use href="#down" x="87" y="86"/>
  <use href="#down" x="135" y="86"/>
  <use href="#down" x="183" y="86"/>
  <!-- growing coin stacks -->
  <ellipse cx="111" cy="198" rx="100" ry="6" fill="#d5def0"/>
  <use href="#coin" x="39" y="190"/>
  <use href="#coin" x="87" y="190"/><use href="#coin" x="87" y="180"/>
  <use href="#coin" x="135" y="190"/><use href="#coin" x="135" y="180"/><use href="#coin" x="135" y="170"/>
  <use href="#coin" x="183" y="190"/><use href="#coin" x="183" y="180"/><use href="#coin" x="183" y="170"/><use href="#coin" x="183" y="160"/>
  <!-- big arrow to bike -->
  <path d="M206 150 H220 V140 L236 156 L220 172 V162 H206 Z" fill="#3fae5a"/>
  <!-- bike -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="252" cy="186" r="20" stroke="#33415c" stroke-width="5"/>
    <circle cx="298" cy="186" r="20" stroke="#33415c" stroke-width="5" transform="translate(-6 0)"/>
    <path d="M252 186 L268 158 L288 158 L292 186 M268 158 L274 186 L288 158" stroke="#e5484d" stroke-width="5"/>
    <path d="M262 150 H276" stroke="#33415c" stroke-width="6"/>
    <path d="M286 158 L282 142 H292" stroke="#33415c" stroke-width="5"/>
  </g>
  <circle cx="252" cy="186" r="4" fill="#33415c"/>
  <circle cx="292" cy="186" r="4" fill="#33415c"/>
  <!-- sparkles over bike -->
  <g fill="#f5b915">
    <path d="M272 108 L276 120 L288 124 L276 128 L272 140 L268 128 L256 124 L268 120 Z"/>
    <path d="M298 128 L300 134 L306 136 L300 138 L298 144 L296 138 L290 136 L296 134 Z"/>
  </g>
</svg>
