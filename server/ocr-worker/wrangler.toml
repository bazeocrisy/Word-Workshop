name = "word-workshop-reader"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Only the published app may call the reader.
ALLOWED_ORIGINS = "https://bazeocrisy.github.io"
MODEL = "claude-sonnet-5-5"
DAILY_LIMIT = "60"

# Secrets (never put these in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put READER_PASSPHRASE
